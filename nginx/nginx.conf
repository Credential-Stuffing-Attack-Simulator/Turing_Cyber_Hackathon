##############################################################################
# Nginx Reverse Proxy — Adversary Simulation Platform
# ============================================================================
# INTENTIONAL SECURITY WEAKNESS: The "weak" rate limiting configuration
# trusts X-Forwarded-For headers for rate limiting, making it trivially
# bypassable by spoofing the XFF header.
#
# This demonstrates MITRE T1110.004 rate-limit bypass.
# For improved defense, see the commented IMPROVED MODE section.
##############################################################################

events {
    worker_connections 1024;
}

http {
    ##########################################################################
    # Structured JSON Access Logging — Telemetry for Dashboard
    ##########################################################################
    log_format json_combined escape=json
        '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"xff":"$http_x_forwarded_for",'
        '"effective_ip":"$http_x_forwarded_for",'
        '"ua":"$http_user_agent",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"limit_status":"$limit_req_status",'
        '"attack_id":"$http_x_attack_id",'
        '"attack_profile":"$http_x_attack_profile"'
        '}';

    access_log /var/log/lab/nginx_access.jsonl json_combined;
    error_log  /var/log/nginx/error.log warn;

    ##########################################################################
    # WEAK MODE — Rate limiting based on X-Forwarded-For (spoofable)
    # ──────────────────────────────────────────────────────────────────────
    # VULNERABILITY: Using $http_x_forwarded_for as the rate-limit key
    # allows attackers to bypass the limit by rotating XFF header values.
    # Each unique XFF value gets its own independent rate-limit bucket.
    ##########################################################################
    limit_req_zone $http_x_forwarded_for  zone=login_weak:10m    rate=5r/s;

    ##########################################################################
    # IMPROVED MODE — Rate limiting by real remote address (not bypassable)
    # ──────────────────────────────────────────────────────────────────────
    # STRONGER: Uses $binary_remote_addr which cannot be spoofed via headers.
    # Combined with burst=0 nodelay for zero-tolerance on rapid attempts.
    ##########################################################################
    limit_req_zone $binary_remote_addr    zone=login_strong:10m  rate=2r/m;
    limit_req_zone $binary_remote_addr    zone=global_limit:10m  rate=20r/s;

    # Rate limit response
    limit_req_status 429;

    ##########################################################################
    # Upstream — Flask Target Application
    ##########################################################################
    upstream target_app {
        server target-app:5000;
        keepalive 32;
    }

    ##########################################################################
    # Main Server Block
    ##########################################################################
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options  nosniff;
        add_header X-Frame-Options         DENY;
        add_header X-Lab-Defense-Mode      "weak";

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        ##############################################################
        # Root — Login Page
        ##############################################################
        location / {
            proxy_pass         http://target_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";
            proxy_http_version 1.1;
        }

        ##############################################################
        # API Login — Weakly Rate Limited (bypassable via XFF)
        # ──────────────────────────────────────────────────────────
        # WEAK: limit_req zone=login_weak
        #   → Rate-limits by X-Forwarded-For value
        #   → Attackers rotate XFF to get a fresh bucket each request
        #   → burst=10 allows additional burst after limit
        ##############################################################
        location /api/login {
            # WEAK RATE LIMITING — intentionally bypassable
            limit_req zone=login_weak burst=10 nodelay;

            proxy_pass         http://target_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";
            proxy_http_version 1.1;

            # Custom error for rate limiting
            error_page 429 @rate_limited;
        }

        ##############################################################
        # Health & Status Endpoints — No rate limiting
        ##############################################################
        location /health {
            proxy_pass         http://target_app;
            proxy_set_header   Host $host;
            access_log         off;
        }

        location /api/status {
            proxy_pass http://target_app;
            proxy_set_header Host $host;
        }

        location /api/telemetry {
            proxy_pass http://target_app;
            proxy_set_header Host $host;
        }

        ##############################################################
        # Custom Rate-Limit Response
        ##############################################################
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"Rate limit exceeded","code":"RATE_LIMITED","message":"Too many login attempts. Try again later."}';
        }
    }
}
